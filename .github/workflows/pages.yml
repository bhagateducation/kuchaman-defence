name: Deploy website preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  check-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check public source preview
        run: |
          preview_base="https://raw.githack.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 \
            "$preview_base/index.html" \
            -o /tmp/kuchaman-preview.html
          grep -q 'Defence Dreams Begin Here' /tmp/kuchaman-preview.html
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 \
            "$preview_base/about-us/index.html" \
            -o /dev/null
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 \
            "$preview_base/wp-content/cache/breeze-minification/css/breeze_kuchamandefenceacademy-in-1-5-1bcc1f7da9ae.css" \
            -o /dev/null
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 \
            "$preview_base/wp-content/uploads/2025/04/IMG-20250409-WA0047-e1744219165459-1024x728.jpg.webp" \
            -o /dev/null

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether GitHub Pages is enabled
        id: pages-status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --location --output /dev/null \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = 200 ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled (HTTP $status). Enable Pages with GitHub Actions as the source in repository settings, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages-status.outputs.enabled == 'true'
      - name: Prepare static site
        if: steps.pages-status.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp index.html clone.js _site/
          cp -R about-us program admission contact-us blog privacy-policy wp-content wp-includes _site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-status.outputs.enabled == 'true'
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages-status.outputs.enabled == 'true'
