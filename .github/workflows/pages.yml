name: Deploy website preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  check-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check public source preview
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 \
            https://raw.githack.com/bhagateducation/kuchaman-defence/main/index.html \
            -o /tmp/kuchaman-preview.html
          grep -q 'Kuchaman Defence Academy' /tmp/kuchaman-preview.html
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 \
            https://raw.githack.com/bhagateducation/kuchaman-defence/main/styles.css \
            -o /dev/null

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether GitHub Pages is enabled
        id: pages-status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --location --output /dev/null \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = 200 ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled (HTTP $status). Enable Pages with GitHub Actions as the source in repository settings, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages-status.outputs.enabled == 'true'
      - name: Prepare static site
        if: steps.pages-status.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp index.html styles.css script.js hero-training.png _site/
          cp -R fonts _site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-status.outputs.enabled == 'true'
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages-status.outputs.enabled == 'true'
